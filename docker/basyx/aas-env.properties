# Eclipse BaSyx AAS Environment — ModVA digital twin
server.port=8081
spring.application.name=ModVA AAS Environment

# In-memory backend: the environment is rebuilt from the AASX on every start, which keeps the
# repository a pure function of the build. Swap for MongoDB to persist runtime changes.
basyx.backend=InMemory

# Preload everything under /application/aas (out/modva.aasx is mounted there).
basyx.environment=file:aas

basyx.cors.allowed-origins=*
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD

basyx.aasrepository.feature.registryintegration=http://aas-registry:8080
basyx.aasrepository.feature.discoveryintegration=http://aas-discovery:8081
basyx.submodelrepository.feature.registryintegration=http://sm-registry:8080
basyx.externalurl=http://localhost:8081

# AASX upload endpoint (POST /upload) for re-deploying a rebuilt package without a restart.
basyx.feature.aasxupload.enabled=true

# Operation delegation (enabled by default). The RunSimulation / GetRunStatus operations carry an
# invocationDelegation qualifier pointing at the simulation runner on the compose network, which
# the default security policy classes as a private target — hence the explicit allowlist.
basyx.submodelrepository.feature.operation.delegation.enabled=true
basyx.submodelrepository.feature.operation.delegation.security.allowlist.hosts=sim-runner
basyx.submodelrepository.feature.operation.delegation.security.allowlist.ports=8000

# Attachments up to the largest dataset CSV (~230 kB) and the FMU (a few MB).
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
